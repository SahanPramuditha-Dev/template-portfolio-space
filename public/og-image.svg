      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="986" cy="124" r="260" fill="url(#glow)"/>
  <circle cx="980" cy="130" r="156" fill="url(#planet)" filter="url(#softShadow)"/>
  <path d="M830 185c86 38 220 38 330-2" fill="none" stroke="#bae6fd" stroke-opacity="0.35" stroke-width="5"/>
  <path d="M797 210c121 63 283 68 407 4" fill="none" stroke="#38bdf8" stroke-opacity="0.32" stroke-width="3"/>

  <g opacity="0.86">
    <circle cx="110" cy="82" r="2" fill="#e0f2fe"/>
    <circle cx="196" cy="174" r="1.8" fill="#93c5fd"/>
    <circle cx="326" cy="94" r="1.6" fill="#f8fafc"/>
    <circle cx="450" cy="510" r="2" fill="#e0f2fe"/>
    <circle cx="635" cy="126" r="1.7" fill="#bae6fd"/>
    <circle cx="752" cy="424" r="1.5" fill="#f8fafc"/>
    <circle cx="1058" cy="516" r="1.8" fill="#bae6fd"/>
