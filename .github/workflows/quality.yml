name: Quality

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint-build-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Install audit tools
        run: npm install --no-save @playwright/test wait-on @lhci/cli

      - name: Start preview
        run: npm run preview -- --host 127.0.0.1 --port 4173 &

      - name: Wait for preview
        run: npx wait-on http://127.0.0.1:4173

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Playwright smoke test
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage();
            const errors = [];
            page.on('console', (msg) => {
              if (msg.type() === 'error') errors.push(msg.text());
            });
            await page.goto('http://127.0.0.1:4173', { waitUntil: 'networkidle' });
            await page.locator('nav a[href="#projects"]').first().click();
            await page.waitForURL(/#projects/, { timeout: 5000 }).catch(() => {});
            if (errors.length) {
              throw new Error(`Console errors found:\n${errors.join('\n')}`);
            }
            await browser.close();
          })();
          NODE

      - name: Lighthouse CI
        run: |
          npx @lhci/cli autorun \
            --collect.url=http://127.0.0.1:4173 \
            --collect.numberOfRuns=1 \
            --assert.preset=lighthouse:recommended \
            --assert.assertions.categories:performance=off \
            --assert.assertions.categories:pwa=off
